site_name: Swayt Frontend
site_description: Swayt 프론트엔드 문서 (구조, 디자인 규칙 링크, 설계 결정 기록)
site_url: https://hoon-23.github.io/bali-frontend/
repo_url: https://github.com/hoon-23/bali-frontend
docs_dir: docs

# 사이트에 싣지 않는 것: 로컬 전용 문서, 설계서·계획서(gitignore 대상), ADR 템플릿, 빌드 의존성 파일
exclude_docs: |
  local/
  specs/
  plans/
  adr/0000-template.md
  requirements.txt
  .DS_Store

theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환

# 메뉴는 파일 구조로 자동 생성한다. 새 문서를 추가해도 설정을 고칠 필요가 없다
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
